id = "renkoya1.approve-all"
name = "Approve All"
version = "0.3.0"
min_herdr_version = "0.7.4"
description = "Approve every blocked agent at once: sends Enter to all waiting panes, accepting the highlighted default (Yes), then verifies each pane left the blocked state and drains the prompts queued behind it."
platforms = ["linux", "macos", "windows"]

[[startup]]
command = ["scripts/dispatch", "startup"]
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "approve-blocked"
title = "Approve all blocked agents"
contexts = ["workspace"]
command = ["scripts/dispatch", "sweep"]
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "auto-on"
title = "Auto-approve: turn ON"
contexts = ["workspace"]
command = ["scripts/dispatch", "on"]
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "auto-off"
title = "Auto-approve: turn OFF"
contexts = ["workspace"]
command = ["scripts/dispatch", "off"]
platforms = ["linux", "macos", "windows"]

[[actions]]
id = "approve-blocked-windows"
title = "Approve all blocked agents (Windows legacy alias)"
contexts = ["workspace"]
command = ["scripts/dispatch", "sweep"]
platforms = ["windows"]

[[actions]]
id = "auto-on-windows"
title = "Auto-approve: turn ON (Windows legacy alias)"
contexts = ["workspace"]
command = ["scripts/dispatch", "on"]
platforms = ["windows"]

[[actions]]
id = "auto-off-windows"
title = "Auto-approve: turn OFF (Windows legacy alias)"
contexts = ["workspace"]
command = ["scripts/dispatch", "off"]
platforms = ["windows"]

[[events]]
on = "pane.agent_status_changed"
command = ["scripts/dispatch", "event"]
platforms = ["linux", "macos", "windows"]
