id = "renkoya1.approve-all"
name = "Approve All"
version = "0.3.0"
min_herdr_version = "0.7.4"
description = "Approve every blocked agent at once: sends Enter to all waiting panes, accepting the highlighted default (Yes), then verifies each pane left the blocked state and drains the prompts queued behind it."
platforms = ["linux", "macos"]

[[actions]]
id = "approve-blocked"
title = "Approve all blocked agents"
contexts = ["workspace"]
command = ["bash", "scripts/approve-blocked.sh"]

[[actions]]
id = "auto-on"
title = "Auto-approve: turn ON"
contexts = ["workspace"]
command = ["bash", "scripts/auto-toggle.sh", "on"]

[[actions]]
id = "auto-off"
title = "Auto-approve: turn OFF"
contexts = ["workspace"]
command = ["bash", "scripts/auto-toggle.sh", "off"]

[[events]]
on = "pane.agent_status_changed"
command = ["bash", "scripts/on-status-changed.sh"]
